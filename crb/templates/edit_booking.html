{% extends "base.html" %}
{% block title %}Edit Booking{% endblock %}
{% block content %}
<div class="card medium">
  <h1>Edit this occurrence</h1>
  {% if error %}<div class="alert error" role="alert"><strong>{{ error }}</strong></div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Date <input type="date" name="date" value="{{ booking['start_time'][:10] }}" required></label>
    <div class="row">
      <label class="field">Start time <input type="time" name="start" value="{{ booking['start_time'][11:16] }}" required></label>
      <label class="field">End time <input type="time" name="end" value="{{ booking['end_time'][11:16] }}" required></label>
    </div>
    <div class="actions"><button type="submit">Save changes</button> <a href="/bookings/{{ booking['id'] }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
