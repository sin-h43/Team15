{% if booking["status"] == "held" and booking["user_id"] == session.get("user_id") %}
<div class="alert info">This room is held for you until {{ booking["hold_expires_at"] }}. Add attendees if you want, then confirm.<br><strong id="hold-timer" data-seconds="{{ seconds_left }}"></strong></div>
<form method="post" action="/bookings/{{ booking['id'] }}/confirm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Confirm booking</button>
</form>
<br>
{% endif %}
