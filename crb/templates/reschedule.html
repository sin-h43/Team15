{% extends "base.html" %}
{% block title %}Move booking{% endblock %}
{% block content %}
<div class="card medium">
  <h1>Move booking {{ code }}</h1>
  {% if error %}<div class="alert error" role="alert"><strong>{{ error }}</strong></div>{% endif %}
  <form method="post" action="/bookings/{{ booking['id'] }}/reschedule">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Room
      <select name="room_id">
        {% for room in rooms %}
        <option value="{{ room['id'] }}" {% if room['id']|string == values['room_id']|string %}selected{% endif %}>{{ room["name"] }} ({{ room["location"] }})</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">Date <input type="date" name="date" value="{{ values['date'] }}" required></label>
    <div class="row">
      <label class="field">Start time <input type="time" name="start" value="{{ values['start'] }}" required></label>
      <label class="field">End time <input type="time" name="end" value="{{ values['end'] }}" required></label>
    </div>
    <div class="actions"><button type="submit">Move booking</button> <a href="/bookings/{{ booking['id'] }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
